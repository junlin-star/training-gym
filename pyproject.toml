[project]
name = "modal-training-gym"
version = "0.1.0"
description = "Reusable building blocks for Modal multi-node training examples"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Modal Labs"}]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "modal",
    "cloudpickle",
    "datasets",
    "msgspec",
    "openai",
    "pydantic",
    "fastapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modal_training_gym"]

[project.scripts]
training-gym = "modal_training_gym.cli:main"

[project.urls]
Homepage = "https://github.com/modal-projects/training-gym"
Documentation = "https://gym.modal.dev"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
]
docs = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.6",
    "properdocs>=1.6.7",
    "pymdown-extensions>=10.21.2",
]
tutorials = [
    "nltk>=3.9.4",
]

[tool.ruff]
extend-exclude = ["tutorials/**"]
