name: Validate Models

on:
  pull_request:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model names to validate (blank = all)"
        required: false
        default: ""
      num_steps:
        description: "Number of training steps (rollouts) per model"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: validate-models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-models:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.list.outputs.models }}
    env:
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Determine models to validate
        id: list
        env:
          MODELS_INPUT: ${{ github.event.inputs.models }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            models=$(git diff "${{ github.event.pull_request.base.sha }}...HEAD" \
              | uv run python scripts/diff_impact.py --models)
          elif [ -n "$MODELS_INPUT" ]; then
            models=$(printf '%s' "$MODELS_INPUT" \
              | uv run python -c "import json,sys; print(json.dumps([m.strip() for m in sys.stdin.read().split(',') if m.strip()]))")
          else
            models=$(uv run python scripts/validate_model_configs.py list)
          fi
          echo "Selected models: $models"
          echo "models=$models" >> "$GITHUB_OUTPUT"

  validate:
    needs: list-models
    if: needs.list-models.outputs.models != '[]'
    runs-on: ubuntu-latest
    environment: modal
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.list-models.outputs.models) }}
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      UV_CACHE_DIR: /tmp/uv-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Validate ${{ matrix.model }}
        run: uv run python scripts/validate_model_configs.py check --model "${{ matrix.model }}" --num_steps "${{ github.event.inputs.num_steps || '1' }}"
